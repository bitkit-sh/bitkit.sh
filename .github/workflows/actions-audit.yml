name: Workflow audit
on:
  pull_request:
    paths: [".github/workflows/**"]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5
        with:
          install_args: actionlint zizmor
          mise_toml: |
            [tools]
            actionlint = "latest"
            zizmor = "latest"
      - run: actionlint
      - run: zizmor .github/workflows
